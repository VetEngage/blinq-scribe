# Who may do what in Blinq Scribe: a role and an action (see policy.csv).
# Whose visit it is (the appointment's provider) is checked in permissions.py.
[request_definition]
r = role, action

[policy_definition]
p = role, action

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.role == p.role && r.action == p.action
