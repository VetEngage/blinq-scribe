{% extends "base.html" %}
{% block body %}
<p style="margin:0 0 12px;">Hi {{ name }},</p>
<p style="margin:0 0 20px;">Someone asked to reset your Blinq Scribe password. To choose a new one, open this link:</p>
<p style="margin:0 0 20px;"><a href="{{ link }}" style="display:inline-block;background:#1f6f5c;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;">Choose a new password</a></p>
<p style="margin:0;">The link works once, for {{ minutes }} minutes.</p>
{% endblock %}
