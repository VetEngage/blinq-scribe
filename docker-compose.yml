# Blinq Scribe on PostgreSQL and Temporal: `docker compose up --build`, then open
# http://localhost:8000. Your .env (optional) adds model keys; the database and
# Temporal addresses below win over it. The one-command run without Docker stays
# on SQLite with no Temporal.
x-blinq-scribe: &blinq-scribe
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://blinq:blinq@postgres:5432/blinq_scribe
    TEMPORAL_ADDRESS: temporal:7233
  volumes:
    - blinq-scribe-data:/data
    - speech-models:/models
  depends_on:
    postgres:
      condition: service_healthy
    temporal:
      condition: service_healthy
  restart: unless-stopped

services:
  blinq-scribe:
    <<: *blinq-scribe
    ports:
      - "8000:8000"

  # Background work: texts after signing, booking link checks, the nightly note
  # sync and Remember expiry.
  worker:
    <<: *blinq-scribe
    command: ["python", "-m", "blinqscribe.worker"]

  # Fetches the Kokoro read-aloud voice into its volume on first start (about
  # 95 MB, checked by SHA-256), then exits. Until it is there, or if it can't be
  # fetched, the web app reads aloud with the browser's voice.
  speech-model:
    <<: *blinq-scribe
    command: ["python", "-m", "blinqscribe.speech", "download"]
    restart: "no"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: blinq
      POSTGRES_PASSWORD: blinq
      POSTGRES_DB: blinq_scribe
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blinq -d blinq_scribe"]
      interval: 2s
      retries: 30

  # Temporal's single-binary dev server, in memory: the worker sets its schedules up
  # again on start. Its web UI is on http://localhost:8233.
  temporal:
    image: temporalio/temporal:1.8.2
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 2s
      retries: 30

volumes:
  blinq-scribe-data:
  speech-models:
  postgres-data:
